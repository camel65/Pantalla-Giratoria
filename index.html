<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotación Impredecible</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #000; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #btn-inicio { padding: 18px 45px; font-size: 1.6rem; color: #00ffcc; background: transparent; border: 2px solid #00ffcc; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 0 25px rgba(0, 255, 204, 0.4); z-index: 10; }
        #btn-inicio:hover { background-color: #00ffcc; color: #000; box-shadow: 0 0 35px rgba(0, 255, 204, 0.8); transform: scale(1.08); }
        .controles { display: none; position: fixed; top: 25px; right: 25px; gap: 12px; z-index: 20; }
        .btn-control { padding: 10px 22px; font-size: 0.95rem; color: #fff; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 30px; backdrop-filter: blur(5px); cursor: pointer; transition: all 0.3s ease; }
        .btn-control:hover { background: rgba(255, 255, 255, 0.25); transform: scale(1.05); }
        #btn-salir:hover { background: rgba(255, 0, 85, 0.8); border-color: #ff0055; box-shadow: 0 0 15px rgba(255, 0, 85, 0.6); }
        #canvas-container { display: none; position: absolute; width: 100%; height: 100%; cursor: pointer; }
        canvas { display: block; }
    </style>
</head>
<body>
    <audio id="miMusica" src="musica3.mp3" preload="auto" loop></audio>
    <button id="btn-inicio">Inicio</button>
    <div class="controles" id="panel-controles">
        <button class="btn-control" id="btn-audio">🔊 Sonido: ON</button>
        <button class="btn-control" id="btn-salir">Salir</button>
    </div>
    <div id="canvas-container">
        <canvas id="rotacionCanvas"></canvas>
    </div>
    <script>
        const btnInicio = document.getElementById('btn-inicio');
        const btnSalir = document.getElementById('btn-salir');
        const btnAudio = document.getElementById('btn-audio');
        const panelControles = document.getElementById('panel-controles');
        const canvasContainer = document.getElementById('canvas-container');
        const canvas = document.getElementById('rotacionCanvas');
        const ctx = canvas.getContext('2d');
        const audioElement = document.getElementById('miMusica');

        let animacionId = null;
        let angulo = 0;
        let velocidadGiro = 0.02;
        let direccionGiro = 1;
        let colorMatiz = 180;
        let activo = false;
        let ondasClic = [];

        function ajustarCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', ajustarCanvas);

        btnAudio.addEventListener('click', (e) => {
            e.stopPropagation();
            audioElement.muted = !audioElement.muted;
            btnAudio.textContent = audioElement.muted ? "🔇 Sonido: OFF" : "🔊 Sonido: ON";
        });

        canvasContainer.addEventListener('click', (e) => {
            if (!activo) return;
            direccionGiro = Math.random() < 0.5 ? -1 : 1;
            velocidadGiro = (Math.random() * 0.07 + 0.01) * direccionGiro;
            colorMatiz = (colorMatiz + Math.random() * 90 + 30) % 360;
            ondasClic.push({ x: e.clientX, y: e.clientY, radio: 10, alpha: 1.0, matiz: colorMatiz });
        });

        btnInicio.addEventListener('click', () => {
            btnInicio.style.display = 'none';
            panelControles.style.display = 'flex';
            canvasContainer.style.display = 'block';
            ajustarCanvas();
            angulo = 0;
            velocidadGiro = 0.03;
            direccionGiro = 1;
            activo = true;
            ondasClic = [];

            audioElement.currentTime = 0;
            audioElement.muted = false;
            btnAudio.textContent = "🔊 Sonido: ON";
            audioElement.play().catch(err => console.log(err));

            iniciarAnimacion();
        });

        btnSalir.addEventListener('click', (e) => {
            e.stopPropagation();
            activo = false;
            if (animacionId) cancelAnimationFrame(animacionId);

            audioElement.pause();
            audioElement.currentTime = 0;

            canvasContainer.style.display = 'none';
            panelControles.style.display = 'none';
            btnInicio.style.display = 'block';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        function iniciarAnimacion() {
            if (!activo) return;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centroX = canvas.width / 2;
            const centroY = canvas.height / 2;

            ctx.save();
            ctx.translate(centroX, centroY);
            ctx.rotate(angulo);

            let lineas = 12;
            let maxRadio = Math.max(canvas.width, canvas.height);

            for (let i = 0; i < lineas; i++) {
                let ang = (i * Math.PI * 2) / lineas;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(ang) * maxRadio, Math.sin(ang) * maxRadio);
                ctx.strokeStyle = `hsl(${(colorMatiz + i * 15) % 360}, 100%, 60%)`;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsl(${(colorMatiz + i * 15) % 360}, 100%, 50%)`;
                ctx.stroke();
            }

            for (let r = 50; r < maxRadio; r += 70) {
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.strokeStyle = `hsla(${(colorMatiz + r) % 360}, 100%, 70%, 0.4)`;
                ctx.lineWidth = 2;
                ctx.setLineDash([20, 20]);
                ctx.stroke();
            }
            ctx.restore();

            for (let i = ondasClic.length - 1; i >= 0; i--) {
                let o = ondasClic[i];
                o.radio += 8;
                o.alpha -= 0.02;
                if (o.alpha <= 0) { ondasClic.splice(i, 1); continue; }
                ctx.beginPath();
                ctx.arc(o.x, o.y, o.radio, 0, Math.PI * 2);
                ctx.strokeStyle = `hsla(${o.matiz}, 100%, 60%, ${o.alpha})`;
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            angulo += velocidadGiro;
            animacionId = requestAnimationFrame(iniciarAnimacion);
        }
    </script>
</body>
</html>
